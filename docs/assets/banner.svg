<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="pixel-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="20" cy="0" r="1" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Pixel Equalizer Animations */
    @keyframes eq1 { 0%, 100% { height: 8px; y: 56px; } 50% { height: 42px; y: 22px; } }
    @keyframes eq2 { 0%, 100% { height: 38px; y: 26px; } 50% { height: 12px; y: 52px; } }
    @keyframes eq3 { 0%, 100% { height: 18px; y: 46px; } 50% { height: 50px; y: 14px; } }
    @keyframes eq4 { 0%, 100% { height: 46px; y: 18px; } 50% { height: 20px; y: 44px; } }
    @keyframes eq5 { 0%, 100% { height: 26px; y: 38px; } 50% { height: 54px; y: 10px; } }
    @keyframes eq6 { 0%, 100% { height: 52px; y: 12px; } 50% { height: 16px; y: 48px; } }
    @keyframes eq7 { 0%, 100% { height: 14px; y: 50px; } 50% { height: 44px; y: 20px; } }
    @keyframes eq8 { 0%, 100% { height: 40px; y: 24px; } 50% { height: 10px; y: 54px; } }

    .bar1 { animation: eq1 1.2s ease-in-out infinite; }
    .bar2 { animation: eq2 0.9s ease-in-out infinite 0.1s; }
    .bar3 { animation: eq3 1.4s ease-in-out infinite 0.2s; }
    .bar4 { animation: eq4 1.1s ease-in-out infinite 0.15s; }
    .bar5 { animation: eq5 1.3s ease-in-out infinite 0.25s; }
    .bar6 { animation: eq6 0.8s ease-in-out infinite 0.05s; }
    .bar7 { animation: eq7 1.25s ease-in-out infinite 0.3s; }
    .bar8 { animation: eq8 1.05s ease-in-out infinite 0.18s; }

    /* Pulse Dot Animation */
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; transform-origin: 75px 42px; }

    /* Ticker Text Glow */
    @keyframes neonShift {
      0%, 100% { stop-color: #06b6d4; }
      50% { stop-color: #3b82f6; }
    }
    
    .pixel-box {
      shape-rendering: crispEdges;
    }
  </style>

  <!-- Container Box with Rounded Borders & Glow -->
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#pixel-grid)" />
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#scanlines)" opacity="0.35" pointer-events="none" />

  <!-- Outer Neon Border Glow Accent -->
  <rect x="3" y="3" width="874" height="274" rx="15" fill="none" stroke="url(#cyan-glow)" stroke-width="1.2" opacity="0.4" />

  <!-- TOP BAR: Status & Header Navigation -->
  <g transform="translate(32, 26)">
    <!-- Retro Pixel Live Pill -->
    <rect class="pixel-box" x="0" y="0" width="190" height="26" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.2" />
    <circle class="pulse-dot" cx="14" cy="13" r="4.5" fill="#10b981" filter="url(#glow)" />
    <text class="mono" x="28" y="17" fill="#34d399" font-size="10.5" font-weight="700" letter-spacing="1">LIVE BENCHMARK READY</text>

    <!-- Center Mode Badge -->
    <rect class="pixel-box" x="202" y="0" width="170" height="26" rx="4" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1.2" />
    <text class="mono" x="214" y="17" fill="#38bdf8" font-size="10.5" font-weight="700" letter-spacing="1">137/137 PASSING (0 CR)</text>

    <!-- Right Telemetry Badge -->
    <rect class="pixel-box" x="650" y="0" width="166" height="26" rx="4" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1.2" />
    <text class="mono" x="662" y="17" fill="#fbbf24" font-size="10.5" font-weight="700" letter-spacing="1">CAP: 341 / 434 (LIVE)</text>
  </g>

  <!-- CENTER: Brand Logo & Title -->
  <g transform="translate(36, 75)">
    <!-- Animated Equalizer (Left) -->
    <g transform="translate(0, 5)">
      <rect class="pixel-box bar1" x="0" y="56" width="6" height="8" rx="1" fill="#06b6d4" />
      <rect class="pixel-box bar2" x="9" y="26" width="6" height="38" rx="1" fill="#06b6d4" opacity="0.85" />
      <rect class="pixel-box bar3" x="18" y="46" width="6" height="18" rx="1" fill="#3b82f6" />
      <rect class="pixel-box bar4" x="27" y="18" width="6" height="46" rx="1" fill="#3b82f6" opacity="0.9" />
      <rect class="pixel-box bar5" x="36" y="38" width="6" height="26" rx="1" fill="#8b5cf6" />
      <rect class="pixel-box bar6" x="45" y="12" width="6" height="52" rx="1" fill="#8b5cf6" opacity="0.85" />
      <rect class="pixel-box bar7" x="54" y="50" width="6" height="14" rx="1" fill="#ec4899" />
      <rect class="pixel-box bar8" x="63" y="24" width="6" height="40" rx="1" fill="#ec4899" opacity="0.9" />
    </g>

    <!-- Main Title: CALL·LENS -->
    <text class="mono" x="90" y="50" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="3" filter="url(#glow)">
      CALL<tspan fill="#06b6d4">·</tspan>LENS
    </text>

    <!-- Subtitle -->
    <text class="mono" x="92" y="76" fill="#94a3b8" font-size="13" font-weight="600" letter-spacing="2">
      INDIC SPEECH INTELLIGENCE &amp; TELEPHONY BENCHMARK PLATFORM
    </text>

    <!-- Animated Equalizer (Right) -->
    <g transform="translate(730, 5)">
      <rect class="pixel-box bar8" x="0" y="24" width="6" height="40" rx="1" fill="#ec4899" opacity="0.9" />
      <rect class="pixel-box bar7" x="9" y="50" width="6" height="14" rx="1" fill="#ec4899" />
      <rect class="pixel-box bar6" x="18" y="12" width="6" height="52" rx="1" fill="#8b5cf6" opacity="0.85" />
      <rect class="pixel-box bar5" x="27" y="38" width="6" height="26" rx="1" fill="#8b5cf6" />
      <rect class="pixel-box bar4" x="36" y="18" width="6" height="46" rx="1" fill="#3b82f6" opacity="0.9" />
      <rect class="pixel-box bar3" x="45" y="46" width="6" height="18" rx="1" fill="#3b82f6" />
      <rect class="pixel-box bar2" x="54" y="26" width="6" height="38" rx="1" fill="#06b6d4" opacity="0.85" />
      <rect class="pixel-box bar1" x="63" y="56" width="6" height="8" rx="1" fill="#06b6d4" />
    </g>
  </g>

  <!-- MIDDLE: Feature Blocks / Pipeline Pills -->
  <g transform="translate(36, 172)">
    <!-- Pill 1: STT Studio -->
    <g transform="translate(0, 0)">
      <rect class="pixel-box" x="0" y="0" width="190" height="36" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <rect class="pixel-box" x="0" y="0" width="3" height="36" fill="#06b6d4" />
      <text class="mono" x="14" y="16" fill="#38bdf8" font-size="10.5" font-weight="700">01 SPEECH TO TEXT</text>
      <text class="sans" x="14" y="29" fill="#94a3b8" font-size="10">Prisma v2.5 vs v3.0 ASR</text>
    </g>

    <!-- Pill 2: TTS Studio -->
    <g transform="translate(204, 0)">
      <rect class="pixel-box" x="0" y="0" width="190" height="36" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <rect class="pixel-box" x="0" y="0" width="3" height="36" fill="#8b5cf6" />
      <text class="mono" x="14" y="16" fill="#c084fc" font-size="10.5" font-weight="700">02 TEXT TO SPEECH</text>
      <text class="sans" x="14" y="29" fill="#94a3b8" font-size="10">7 Curated Timbre Voices</text>
    </g>

    <!-- Pill 3: Live Playground -->
    <g transform="translate(408, 0)">
      <rect class="pixel-box" x="0" y="0" width="190" height="36" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <rect class="pixel-box" x="0" y="0" width="3" height="36" fill="#10b981" />
      <text class="mono" x="14" y="16" fill="#34d399" font-size="10.5" font-weight="700">03 WEBSOCKETS</text>
      <text class="sans" x="14" y="29" fill="#94a3b8" font-size="10">Mic Audio Transport &amp; REST</text>
    </g>

    <!-- Pill 4: Follow-up Desk -->
    <g transform="translate(612, 0)">
      <rect class="pixel-box" x="0" y="0" width="196" height="36" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <rect class="pixel-box" x="0" y="0" width="3" height="36" fill="#f59e0b" />
      <text class="mono" x="14" y="16" fill="#fbbf24" font-size="10.5" font-weight="700">04 BFSI COLLECTION</text>
      <text class="sans" x="14" y="29" fill="#94a3b8" font-size="10">Human-in-Loop Reminder Desk</text>
    </g>
  </g>

  <!-- BOTTOM BAR: Empirical Metric Ticker -->
  <g transform="translate(36, 226)">
    <rect class="pixel-box" x="0" y="0" width="808" height="34" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="#1e293b" stroke-width="1" />

    <!-- Metric 1: Clean Audio WER -->
    <text class="mono" x="20" y="21" fill="#64748b" font-size="10" font-weight="600">CLEAN WER:</text>
    <text class="mono" x="90" y="21" fill="#34d399" font-size="11" font-weight="800">6.65%</text>
    <text class="mono" x="135" y="21" fill="#475569" font-size="10">(v3.0)</text>

    <!-- Divider -->
    <text class="mono" x="185" y="21" fill="#334155" font-size="11">│</text>

    <!-- Metric 2: 0 dB Noise WER -->
    <text class="mono" x="205" y="21" fill="#64748b" font-size="10" font-weight="600">0 dB SNR NOISE:</text>
    <text class="mono" x="308" y="21" fill="#fbbf24" font-size="11" font-weight="800">18.92%</text>
    <text class="mono" x="358" y="21" fill="#475569" font-size="10">(v2.5)</text>

    <!-- Divider -->
    <text class="mono" x="408" y="21" fill="#334155" font-size="11">│</text>

    <!-- Metric 3: Total Evaluations -->
    <text class="mono" x="428" y="21" fill="#64748b" font-size="10" font-weight="600">EVALS IN DB:</text>
    <text class="mono" x="510" y="21" fill="#38bdf8" font-size="11" font-weight="800">360 RUNS</text>
    <text class="mono" x="575" y="21" fill="#475569" font-size="10">(Exp A, D, F)</text>

    <!-- Divider -->
    <text class="mono" x="660" y="21" fill="#334155" font-size="11">│</text>

    <!-- Metric 4: Protocol -->
    <text class="mono" x="678" y="21" fill="#64748b" font-size="10" font-weight="600">CHANNEL:</text>
    <text class="mono" x="738" y="21" fill="#a78bfa" font-size="11" font-weight="800">ITU-T G.712</text>
  </g>
</svg>